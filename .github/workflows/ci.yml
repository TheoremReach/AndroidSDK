name: CI

# Every push builds the example app on GitHub's Linux runner: the release APK, linted, and a debug APK kept as an
# artifact for the device checks.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Which SDK build the repo ships, for the example app and for apps that add the AAR by hand: each names its
      # version and the commit it was built from.
      - name: Show the SDK build
        run: |
          for aar in theoremreach-release.aar app/libs/theoremreach-3.7.0.aar; do
            unzip -p "$aar" classes.jar > "$RUNNER_TEMP/classes.jar"
            echo "$aar:"
            javap -constants -cp "$RUNNER_TEMP/classes.jar" theoremreach.com.theoremreach.BuildConfig \
              | grep -E ' (VERSION_NAME|SOURCE_COMMIT) =' || true
          done

      - name: Build the release APK and lint it, and build a debug APK
        run: ./gradlew --console=plain assembleRelease lintRelease assembleDebug

      - name: Keep the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.*
          if-no-files-found: warn
