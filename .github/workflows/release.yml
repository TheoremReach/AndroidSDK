name: Release (tag the AAR)

# On demand only. Tags the commit holding the SDK's AAR, the one apps add by hand and the example app builds on. Before
# tagging, the job checks that both copies are the version being released and were built from the SDK commit being
# released, the one Maven Central's release was built from, so a tag can't point at an earlier build. A dry run, the
# default, checks and doesn't tag.
#
# The push trigger only registers the workflow, so it can be dispatched on a branch before it reaches master. Its job
# runs on dispatch alone.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, which the AAR must declare (BuildConfig.VERSION_NAME)
        required: true
      sdk_commit:
        description: The TheoremReach-Android-SDK commit the release was built from (its full SHA)
        required: true
      dry_run:
        description: Dry run (check, don't tag)
        type: boolean
        default: true
  push:
    paths:
      - .github/workflows/release.yml

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Check the AAR and tag (dry run unless unticked)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the version tag
    env:
      VERSION: ${{ inputs.version }}
      SDK_COMMIT: ${{ inputs.sdk_commit }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the AAR against the release
        run: |
          for aar in theoremreach-release.aar "app/libs/theoremreach-$VERSION.aar"; do
            unzip -p "$aar" classes.jar > "$RUNNER_TEMP/classes.jar"
            constants=$(javap -constants -cp "$RUNNER_TEMP/classes.jar" theoremreach.com.theoremreach.BuildConfig)
            built_version=$(sed -n 's/.* VERSION_NAME = "\(.*\)";/\1/p' <<< "$constants")
            built_from=$(sed -n 's/.* SOURCE_COMMIT = "\(.*\)";/\1/p' <<< "$constants")
            echo "$aar: $built_version, built from ${built_from:-an unrecorded commit}"
            if [ "$built_version" != "$VERSION" ] || [ "$built_from" != "$SDK_COMMIT" ]; then
              echo "::error::$aar is not the $VERSION build from $SDK_COMMIT"
              exit 1
            fi
          done
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::The tag $VERSION exists already"
            exit 1
          fi

      - name: Tag the commit
        if: inputs.dry_run == false
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
